name: GitHub Release

# Run from the Actions tab ("Run workflow") or `npm run release`. It tags the
# current main and writes notes from src/lib/releases.json. It never commits to
# main, so it never triggers a Vercel deploy.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1
          sparse-checkout: |
            scripts
            src/lib
      - name: Create the monthly CalVer release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="$(TZ=America/Chicago date +%Y).$((10#$(TZ=America/Chicago date +%m)))"
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName,publishedAt \
            --jq '.[] | select(.tagName | test("^20[0-9]{2}\\.[0-9]+\\.[0-9]+$")) | "\(.tagName) \(.publishedAt[0:10])"')"
          last_n="$(printf '%s\n' "$tags" | awk -v p="$prefix" 'index($1, p".") == 1 { split($1, a, "."); if (a[3] > n) n = a[3] } END { print n + 0 }')"
          version="${prefix}.$((last_n + 1))"
          since="$(printf '%s\n' "$tags" | awk 'NF { print $2 }' | sort | tail -1)"
          since="${since:-$(TZ=America/Chicago date +%Y-%m-01)}"
          node scripts/release-notes.mjs --since "$since" > notes.md
          gh release create "$version" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$version" --notes-file notes.md
          echo "Released $version (entries after $since)" >> "$GITHUB_STEP_SUMMARY"
