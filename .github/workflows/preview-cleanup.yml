name: Preview cleanup
on:
  schedule:
    - cron: '23 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: preview-infrastructure
  queue: max
  cancel-in-progress: false
jobs:
  cleanup:
    if: vars.PREVIEW_CLEANUP_ENABLED == 'true' && github.ref == 'refs/heads/main'
    environment: preview-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --global npm@11.17.0
      - run: npm ci
      - run: node scripts/cleanup-previews.mjs --apply
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
