name: Managed previews

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: preview-infrastructure
  queue: max
  cancel-in-progress: false

jobs:
  preview:
    if: >-
      vars.MANAGED_PREVIEWS_ENABLED == 'true' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.actor.login != 'dependabot[bot]' &&
      !startsWith(github.event.workflow_run.head_branch, 'dependabot/') &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    environment: preview-infrastructure
    timeout-minutes: 25
    steps:
      # Always use trusted default-branch orchestration. Forks receive no secrets.
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      # Explicit needed=false skips. A missing output still provisions.
      - name: Decide whether this pull request needs a preview database
        id: scope
        run: node scripts/preview-ci-gate.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v7
        if: steps.scope.outputs.needed != 'false'
        with:
          node-version: 24
          cache: npm
      - run: npm install --global npm@11.17.0 vercel@59.11.7
        if: steps.scope.outputs.needed != 'false'
      - run: npm ci
        if: steps.scope.outputs.needed != 'false'
      - name: Provision and upload exact validated PR
        if: steps.scope.outputs.needed != 'false'
        run: node scripts/preview-ci.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY: ${{ secrets.NEON_PREVIEW_API_KEY }}
          PREVIEW_SIGNING_KEY: ${{ secrets.PREVIEW_SIGNING_KEY }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_PREVIEW_TOKEN }}
