name: Neon cost watch
on:
  schedule:
    - cron: '41 14 * * 1'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: preview-infrastructure
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: node scripts/neon-cost-watch.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEON_COST_WATCH_API_KEY: ${{ secrets.NEON_COST_WATCH_API_KEY }}
