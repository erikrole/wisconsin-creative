name: Skill suite

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/verify-skills.py'
      - 'scripts/evaluate-skills.py'
      - 'scripts/requirements-skills.txt'
      - '.github/workflows/skills.yml'
      - 'AGENTS.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'scripts/verify-skills.py'
      - 'scripts/evaluate-skills.py'
      - 'scripts/requirements-skills.txt'
      - '.github/workflows/skills.yml'
      - 'AGENTS.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-skills.txt
      - run: python -m pip install -r scripts/requirements-skills.txt
      # No app install, database, credentials, Codex account, or model calls.
      - run: npm run verify:skills
