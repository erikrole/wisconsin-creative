name: Skill suite

on:
  pull_request:
    paths:
      - '.agents/skills/**'
      - 'scripts/verify-skills.py'
      - 'scripts/evaluate-skills.py'
      - 'scripts/requirements-skills.txt'
      - '.github/workflows/skills.yml'
      - 'AGENTS.md'
      - 'package.json'
  push:
    branches: [main]
    paths:
      - '.agents/skills/**'
      - 'scripts/verify-skills.py'
      - 'scripts/evaluate-skills.py'
      - 'scripts/requirements-skills.txt'
      - '.github/workflows/skills.yml'
      - 'AGENTS.md'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: scripts/requirements-skills.txt
      - run: python -m pip install -r scripts/requirements-skills.txt
      # No app install, database, credentials, Codex account, or model calls.
      - run: npm run verify:skills
