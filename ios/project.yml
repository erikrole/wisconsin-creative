name: Wisconsin
options:
  bundleIdPrefix: com.erikrole
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: "NO"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEVELOPMENT_TEAM: T26T3G8C7Q
    STRING_CATALOG_GENERATE_SYMBOLS: "YES"
    # Xcode 26 recommended settings. These are the mechanical ones: type-safe
    # asset symbols, string-catalog preference, and dead-code stripping. They
    # change build output, not runtime semantics.
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
    LOCALIZATION_PREFERS_STRING_CATALOGS: "YES"
    DEAD_CODE_STRIPPING: "YES"

packages:
  # CommonMark + GFM parsing for the Resources reader. Wraps the same cmark-gfm
  # engine the web reader reaches through remark-gfm, so both clients agree on
  # the document. Contract: docs/GUIDE_MARKDOWN.md.
  swift-markdown:
    url: https://github.com/apple/swift-markdown
    from: 0.8.0

targets:
  Wisconsin:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.erikrole.Wisconsin
    sources:
      - path: Wisconsin
        excludes:
          - Kiosk/**
          - KioskOnly/**
    info:
      path: Wisconsin/Supporting/Info.plist
      properties:
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDisplayName: "Creative"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: "Wisconsin Creative uses the camera to scan gear barcodes and QR codes."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - wisconsin
        UIAppFonts:
          - Gotham-Black.ttf
          - Gotham-Bold.ttf
    entitlements:
      path: Wisconsin/Wisconsin.entitlements
      properties:
        aps-environment: production
        com.apple.developer.associated-domains:
          - webcredentials:wisconsincreative.com
        # Shared container the Home Screen widgets read their snapshot from.
        com.apple.security.application-groups:
          - group.com.erikrole.Wisconsin
    dependencies:
      - target: WisconsinLiveActivities
      - package: swift-markdown
        product: Markdown
    settings:
      base:
        PRODUCT_NAME: Wisconsin Creative
        PRODUCT_MODULE_NAME: Wisconsin
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "30"
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "-DDEBUG"

  WisconsinKiosk:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.erikrole.WisconsinKiosk
    sources:
      - path: Wisconsin/KioskOnly
      - path: Wisconsin/Kiosk
      - path: Wisconsin/Shared
      - path: Wisconsin/Assets.xcassets
      - path: Wisconsin/Resources
    info:
      path: Wisconsin/KioskOnly/Info.plist
      properties:
        UILaunchScreen:
          UIColorName: ""
        # Landscape only. The kiosk is a counter-mounted iPad and every layout
        # in it is designed as a two-column landscape task; portrait was a
        # supported-but-unloved fallback that nothing was verified against.
        #
        # iPadOS requires an app to support every orientation UNLESS it declares
        # that it needs the full screen — multitasking hands a resized scene any
        # aspect it likes, so a landscape-only app cannot also be a Split View
        # citizen. This was removed in the 2026-07-09 windowing cleanup when the
        # kiosk still declared all four orientations; restoring it is what makes
        # the landscape lock legal rather than a warning.
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: "Wisconsin Creative uses the camera to scan gear barcodes and QR codes."
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        UIAppFonts:
          - Gotham-Black.ttf
          - Gotham-Bold.ttf
    settings:
      base:
        PRODUCT_NAME: Wisconsin Kiosk
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
      configs:
        Debug:
          OTHER_SWIFT_FLAGS: "-DDEBUG"

  WisconsinTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WisconsinTests
    dependencies:
      - target: Wisconsin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: WisconsinTests
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.WisconsinTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wisconsin Creative.app/Wisconsin Creative"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WisconsinUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WisconsinUITests
    dependencies:
      - target: Wisconsin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: WisconsinUITests
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.WisconsinUITests
        TEST_TARGET_NAME: Wisconsin

  WisconsinKioskTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: WisconsinKioskTests
    dependencies:
      - target: WisconsinKiosk
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_NAME: WisconsinKioskTests
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.WisconsinKioskTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wisconsin Kiosk.app/Wisconsin Kiosk"
        BUNDLE_LOADER: "$(TEST_HOST)"

  WisconsinLiveActivities:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    bundleId: com.erikrole.Wisconsin.LiveActivities
    sources:
      - path: WisconsinLiveActivities
      - path: Wisconsin/LiveActivities/CheckoutReturnActivityAttributes.swift
      # The widget process has no session of its own; this is the whole of
      # what it is allowed to know. Shared, not duplicated, so the two
      # processes can never disagree about the payload shape.
      - path: Wisconsin/Widgets/GearWidgetSnapshot.swift
    entitlements:
      path: WisconsinLiveActivities/WisconsinLiveActivities.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.erikrole.Wisconsin
    info:
      path: WisconsinLiveActivities/Info.plist
      properties:
        CFBundleDisplayName: "Wisconsin Creative Live Activities"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_NAME: WisconsinLiveActivities
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.Wisconsin.LiveActivities
        MARKETING_VERSION: "1.2"
        CURRENT_PROJECT_VERSION: "30"
        SKIP_INSTALL: YES
        SWIFT_STRICT_CONCURRENCY: complete

schemes:
  Wisconsin:
    build:
      targets:
        Wisconsin: all
        WisconsinLiveActivities: all
    test:
      targets:
        - name: WisconsinTests
          randomExecutionOrder: true
      gatherCoverageData: true

  WisconsinPerformance:
    build:
      targets:
        Wisconsin: all
        WisconsinLiveActivities: all
    test:
      targets:
        - name: WisconsinUITests
          randomExecutionOrder: false
      gatherCoverageData: false

  WisconsinKiosk:
    build:
      targets:
        WisconsinKiosk: all
    test:
      targets:
        - name: WisconsinKioskTests
          randomExecutionOrder: true
      gatherCoverageData: true
