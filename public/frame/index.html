<!doctype html>
<!-- Photo Frame. Canonical source: edit here. Run `node scripts/hash-static-tools.mjs` after changing a script. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#08090a">
  <meta name="robots" content="noindex">
  <title>Photo Frame</title>
  <meta name="description" content="Drop in a photo and get a clean frame with its camera settings and photographer credit, ready to export as a PNG.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%2308090a'/%3E%3Crect x='3' y='2.5' width='10' height='8' rx='1' fill='none' stroke='%23fff' stroke-width='1.2'/%3E%3Crect x='3' y='12' width='5' height='1.4' fill='%23a00000'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: "Gotham"; src: url("/Gotham-Black.woff2") format("woff2"); font-weight: 800; font-display: swap; }
    @font-face { font-family: "Gotham"; src: url("/Gotham-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gotham"; src: url("/Gotham-Medium.woff2") format("woff2"); font-weight: 500; font-display: swap; }
    @font-face { font-family: "Gotham"; src: url("/Gotham-Book.woff2") format("woff2"); font-weight: 400; font-display: swap; }

    :root {
      --body: #08090a;
      --glass: rgba(22, 23, 26, 0.86);
      --line: rgba(255, 255, 255, 0.09);
      --line-2: rgba(255, 255, 255, 0.16);
      --ink: #f4f2ed;
      --ink-2: #b4b3ae;
      --ink-3: #7d7d78;
      --red: #a00000;
      --red-hi: #c40a0a;
      --danger: #ff7b7b;
      --font: "Gotham", system-ui, -apple-system, "Segoe UI", sans-serif;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--body); }
    body { margin: 0; min-width: 300px; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; background: var(--body); }
    button, input { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid #fff; outline-offset: 2px; border-radius: 6px; }

    .topbar { display: flex; align-items: center; gap: 12px; height: 56px; padding: env(safe-area-inset-top) clamp(16px, 4vw, 28px) 0; }
    .brand { margin-right: auto; font-weight: 700; font-size: 12px; letter-spacing: 0.2em; text-transform: uppercase; }
    .brand i { display: inline-block; width: 7px; height: 7px; margin-right: 10px; border-radius: 50%; background: var(--red-hi); }
    .back { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-3); text-decoration: none; font-size: 12px; font-weight: 500; letter-spacing: 0.04em; transition: color 140ms var(--ease); }
    .back:hover { color: var(--ink); }
    .back svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }

    main { flex: 1; display: grid; grid-template-rows: 1fr auto; justify-items: center; min-height: 0; padding: 0 clamp(14px, 4vw, 40px) calc(20px + env(safe-area-inset-bottom)); gap: 18px; }
    .stage { position: relative; display: grid; place-items: center; width: 100%; max-width: 1100px; min-height: 0; padding: 8px 0; }
    #canvas { display: none; max-width: 100%; max-height: calc(100dvh - 190px); width: auto; height: auto; border-radius: 6px; box-shadow: 0 40px 90px -40px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.07); }
    .stage.has-photo #canvas { display: block; }

    .drop { display: grid; justify-items: center; gap: 6px; width: min(440px, 100%); padding: 64px 24px; text-align: center; border-radius: 22px; border: 1px solid var(--line); background: rgba(255, 255, 255, 0.025); cursor: pointer; transition: border-color 160ms var(--ease), background 160ms var(--ease); }
    .drop:hover, .stage.dragging .drop { border-color: var(--line-2); background: rgba(255, 255, 255, 0.05); }
    .drop svg { width: 30px; height: 30px; margin-bottom: 14px; fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .drop strong { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
    .drop span { font-size: 13px; color: var(--ink-3); }
    .stage.has-photo .drop { display: none; }
    .stage.dragging #canvas { opacity: 0.4; }

    .dock { position: relative; width: min(100%, 900px); display: grid; justify-items: center; gap: 10px; }
    .bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 14px; padding: 8px; border-radius: 22px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 20px 50px -24px rgba(0, 0, 0, 0.9); }
    .seg { display: inline-flex; padding: 3px; border-radius: 999px; background: rgba(255, 255, 255, 0.06); }
    .seg-button { min-height: 32px; padding: 0 13px; border: 0; border-radius: 999px; background: none; color: var(--ink-2); font-size: 12px; font-weight: 500; cursor: pointer; transition: background 140ms var(--ease), color 140ms var(--ease); }
    .seg-button:hover { color: var(--ink); }
    .seg-button[aria-pressed="true"] { background: #fff; color: #08090a; font-weight: 700; }
    .swatches { display: inline-flex; gap: 8px; align-items: center; padding: 0 4px; }
    .swatch, .custom { width: 24px; height: 24px; padding: 0; border-radius: 50%; background: var(--c); border: 1px solid var(--line-2); cursor: pointer; transition: transform 140ms var(--ease); }
    .swatch:hover, .custom:hover { transform: scale(1.12); }
    .swatch[aria-pressed="true"], .custom.active { box-shadow: 0 0 0 2px #121316, 0 0 0 3.5px #fff; }
    .custom { position: relative; overflow: hidden; background: conic-gradient(from 0deg, #f33, #fd3, #3d6, #3cf, #93f, #f33); }
    .custom.active { background: var(--c); }
    .custom input { position: absolute; inset: -6px; width: 40px; height: 40px; opacity: 0; cursor: pointer; }
    .pill { display: inline-flex; align-items: center; justify-content: center; gap: 7px; min-height: 36px; padding: 0 16px; border-radius: 999px; border: 0; background: rgba(255, 255, 255, 0.08); color: var(--ink); font-size: 12px; font-weight: 500; cursor: pointer; transition: background 140ms var(--ease); }
    .pill:hover { background: rgba(255, 255, 255, 0.14); }
    .pill[aria-expanded="true"] { background: rgba(255, 255, 255, 0.16); }
    .pill.primary { background: var(--red); color: #fff; font-weight: 700; }
    .pill.primary:hover { background: var(--red-hi); }
    .pill:disabled { opacity: 0.35; cursor: not-allowed; }
    .pill svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

    .details { position: absolute; left: 0; right: 0; bottom: calc(100% + 10px); padding: 14px; border-radius: 20px; background: var(--glass); border: 1px solid var(--line); -webkit-backdrop-filter: blur(24px); backdrop-filter: blur(24px); box-shadow: 0 30px 70px -30px rgba(0, 0, 0, 0.95); max-height: min(60dvh, 460px); overflow: auto; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px 14px; }
    @media (max-width: 620px) { .fields { grid-template-columns: 1fr; } }
    .field { display: grid; grid-template-columns: 20px 78px minmax(0, 1fr); align-items: center; gap: 8px; }
    .field label { font-size: 11px; font-weight: 500; letter-spacing: 0.06em; color: var(--ink-3); white-space: nowrap; }
    .field input[type="checkbox"] { width: 16px; height: 16px; margin: 0; accent-color: var(--red-hi); cursor: pointer; }
    .field input[type="text"] { width: 100%; height: 36px; padding: 0 11px; border-radius: 10px; background: rgba(255, 255, 255, 0.05); border: 1px solid transparent; font-size: 13px; transition: border-color 140ms var(--ease), background 140ms var(--ease); }
    .field input[type="text"]:hover { background: rgba(255, 255, 255, 0.08); }
    .field input[type="text"]:focus { border-color: var(--line-2); outline: none; background: rgba(255, 255, 255, 0.08); }
    .field input[type="text"]::placeholder { color: #55554f; }
    .field.off label, .field.off input[type="text"] { opacity: 0.4; }

    .status { min-height: 18px; margin: 0; font-size: 12px; color: var(--ink-3); text-align: center; }
    .status.error { color: var(--danger); }
    .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <span class="brand"><i aria-hidden="true"></i>Photo Frame</span>
    <a class="back" href="/apps">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>
      Apps
    </a>
  </header>

  <main>
    <div class="stage" id="stage">
      <label class="drop" id="drop" for="file" tabindex="0">
        <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="4" y="5" width="24" height="22" rx="3"/><path d="M4 21l7-6 6 5 4-3 7 6"/><circle cx="21.5" cy="11.5" r="1.8"/></svg>
        <strong>Drop a photo</strong>
        <span>or click to choose one. You can also paste.</span>
      </label>
      <canvas id="canvas" role="img" aria-label="Framed preview"></canvas>
      <input class="visually-hidden" id="file" type="file" accept="image/jpeg,image/png,image/webp" tabindex="-1">
    </div>

    <div class="dock">
      <div class="details" id="details" hidden>
        <div class="fields" id="fields"></div>
      </div>
      <div class="bar" id="toolbar">
        <div class="seg" id="formats" role="group" aria-label="Size"></div>
        <div class="swatches" id="swatches" role="group" aria-label="Frame color">
          <label class="custom" id="custom" title="Pick any color"><input type="color" id="color" value="#000000" aria-label="Custom frame color"></label>
        </div>
        <button class="pill" id="details-toggle" type="button" aria-expanded="false" aria-controls="details">Details</button>
        <button class="pill" id="change" type="button" hidden>
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8a5.5 5.5 0 0 1 9.4-3.9L13.5 5.5M13.5 2.5v3h-3M13.5 8a5.5 5.5 0 0 1-9.4 3.9L2.5 10.5M2.5 13.5v-3h3"/></svg>
          Change photo
        </button>
        <button class="pill primary" id="export" type="button" disabled>Export PNG</button>
      </div>
      <p class="status" id="status" role="status"></p>
    </div>
  </main>

  <script src="core.js?v=3c69bf5c3da9"></script>
  <script src="app.js?v=e6f9bc7a0584"></script>
</body>
</html>
