<!doctype html>
<!-- Board Sizes. Sizes live in boards.json. Run `node scripts/build-board-sizes.mjs` after changing them or this page's scripts. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'; img-src data: blob:; media-src blob:; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <title>Board Sizes</title>
  <meta name="description" content="Every board, ribbon, table and IPTV canvas at Camp Randall, the Kohl Center, the Field House, LaBahn and Goodman: sizes, zones, delivery specs, and which boards each piece of content needs.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%23c5050c'/%3E%3Crect x='3' y='4.5' width='10' height='5' rx='.8' fill='none' stroke='%23fff' stroke-width='1.2'/%3E%3Cpath d='M3 12h10' stroke='%23fff' stroke-width='1.2'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: "Lato"; src: url("/Lato-Regular.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "Lato"; src: url("/Lato-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Lato"; src: url("/Lato-Black.woff2") format("woff2"); font-weight: 900; font-display: swap; }
    /* wc-fresh structure (Lato, cool neutrals, soft rounded sheets on the
       dotted canvas) with the Badger red kept as the accent. Zones stay
       blueprint blue; picks and hovers go ink. */
    :root {
      --bg: #fbfbfc; --side: #ffffff; --hover: rgba(28, 32, 36, 0.05); --active: rgba(28, 32, 36, 0.08);
      --ink: #1c2024; --ink-2: #60646c; --ink-3: #696c75; --line: #e8e8ec; --line-2: #d9dae0;
      --card: #ffffff; --well: #f7f8fa; --code: rgba(28, 32, 36, 0.055);
      --accent: #c5050c; --accent-ink: #a3040a; --accent-soft: rgba(197, 5, 12, 0.07); --on-accent: #ffffff;
      --zone: #2b6cb0; --zone-soft: rgba(43, 108, 176, 0.07); --hot: #d97706; --hot-soft: rgba(217, 119, 6, 0.14);
      --warn: #b3261e; --warn-soft: rgba(179, 38, 30, 0.07); --info-soft: rgba(28, 32, 36, 0.04);
      --shadow: 0 0 0 1px var(--line), 0 1px 2px rgba(16, 24, 40, 0.04), 0 10px 28px -18px rgba(16, 24, 40, 0.22);
      --pop-shadow: 0 0 0 1px var(--line-2), 0 12px 32px -12px rgba(16, 24, 40, 0.28);
      --grid: rgba(28, 32, 36, 0.06); --dots: rgba(28, 32, 36, 0.11);
      --font: "Lato", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
      --ease: cubic-bezier(0.2, 0, 0, 1);
      --wide: 1240px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --grid: rgba(255, 255, 255, 0.05); --dots: rgba(255, 255, 255, 0.08);
        --bg: #111214; --side: #16171a; --hover: rgba(255, 255, 255, 0.05); --active: rgba(255, 255, 255, 0.085);
        --ink: #ececef; --ink-2: #b4b6bd; --ink-3: #9497a0; --line: #26282d; --line-2: #34373d;
        --card: #18191c; --well: #1c1d21; --code: rgba(255, 255, 255, 0.07);
        --accent: #ff6b70; --accent-ink: #ff8d91; --accent-soft: rgba(255, 107, 112, 0.13); --on-accent: #ffffff;
        --zone: #6aa8ea; --zone-soft: rgba(106, 168, 234, 0.1); --hot: #f5a524; --hot-soft: rgba(245, 165, 36, 0.18);
        --warn: #ff8a80; --warn-soft: rgba(255, 138, 128, 0.08); --info-soft: rgba(255, 255, 255, 0.04);
        --shadow: 0 0 0 1px var(--line), 0 10px 28px -18px rgba(0, 0, 0, 0.6);
        --pop-shadow: 0 0 0 1px var(--line-2), 0 14px 36px -12px rgba(0, 0, 0, 0.7);
        color-scheme: dark;
      }
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html, body { background: var(--bg); }
    body { background: var(--bg) radial-gradient(circle, var(--dots) 1px, transparent 1.3px) 0 0 / 22px 22px; }
    body { margin: 0; min-width: 300px; color: var(--ink); font: 14px/1.5 var(--font); -webkit-font-smoothing: antialiased; }
    button, input { font: inherit; color: inherit; }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
    .skip {
      position: absolute; left: 12px; top: 0; z-index: 40; transform: translateY(-120%);
      padding: 8px 12px; border-radius: 8px; background: var(--ink); color: var(--bg); text-decoration: none; font-weight: 500;
    }
    .skip:focus { transform: none; top: 12px; }
    .icon { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    kbd { font: 11px var(--mono); padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line-2); color: var(--ink-3); background: var(--bg); }

    /* ---- shell: brand, search and venue tabs across the top ---- */
    .app { min-height: 100vh; }
    .topbar { position: relative; z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--side) 88%, transparent); backdrop-filter: saturate(1.4) blur(12px); -webkit-backdrop-filter: saturate(1.4) blur(12px); }
    .topbar-in { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; max-width: var(--wide); margin: 0 auto; padding: 12px clamp(16px, 4vw, 56px) 0; }
    .search { position: relative; display: block; width: min(280px, 100%); }
    .search .icon { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--ink-3); width: 14px; height: 14px; }
    .search input { width: 100%; height: 36px; padding: 0 36px 0 33px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 13.5px; transition: border-color 140ms var(--ease), box-shadow 140ms var(--ease), background-color 140ms var(--ease); }
    .search input:hover { border-color: var(--line-2); }
    .search input::placeholder { color: var(--ink-3); }
    .search input:focus { outline: none; background: var(--card); border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .search input::-webkit-search-cancel-button { cursor: pointer; }
    .search kbd { position: absolute; right: 9px; top: 50%; transform: translateY(-50%); }
    .search input:focus ~ kbd, .search input:not(:placeholder-shown) ~ kbd { display: none; }
    .top-links { display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px; font-size: 13px; }
    .top-links a, .top-links button { white-space: nowrap; }
    .btn.menu-toggle { display: none; }
    .nav, .nav ul { list-style: none; margin: 0; padding: 0; }
    .nav button { min-height: 32px; padding: 4px 10px; display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; color: var(--ink-2); font-size: 13px; white-space: nowrap; transition: background-color 120ms var(--ease), color 120ms var(--ease); }
    .nav button:hover { background: var(--hover); color: var(--ink); }
    .nav button[aria-current="true"] { background: var(--active); color: var(--ink); font-weight: 700; }
    .nav .count { font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .nav .count.is-warn { min-width: 18px; padding: 0 5px; border-radius: 999px; background: var(--warn-soft); color: var(--warn); font-weight: 700; text-align: center; }
    .top-links .nav { display: flex; gap: 2px; }
    .top-links a { display: inline-flex; align-items: center; gap: 6px; min-height: 32px; padding: 4px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; }
    .top-links a:hover { background: var(--hover); color: var(--ink); }
    .venue-tabs { max-width: var(--wide); margin: 0 auto; padding: 8px clamp(16px, 4vw, 56px) 0; overflow-x: auto; scrollbar-width: none; }
    .venue-tabs::-webkit-scrollbar { display: none; }
    .tabs { display: flex; gap: 4px; min-width: max-content; }
    .tabs button { position: relative; min-height: 42px; padding: 0 12px; border-radius: 8px 8px 0 0; font-size: 14px; }
    .tabs button:hover { background: transparent; }
    .tabs button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: -1px; height: 2px; border-radius: 2px 2px 0 0; background: transparent; transition: background-color 140ms var(--ease); }
    .tabs button:hover::after { background: var(--line-2); }
    .tabs button[aria-current="true"] { background: transparent; font-weight: 700; color: var(--ink); }
    .tabs button[aria-current="true"]::after { background: var(--accent); }
    .tabs button[aria-current="true"] .count { color: var(--accent-ink); }

    main { min-width: 0; padding: 36px clamp(16px, 4vw, 56px) 88px; }
    .page { max-width: var(--wide); margin: 0 auto; }

    /* ---- page header ---- */
    .crumbs { font-size: 13px; color: var(--ink-3); margin-bottom: 6px; }
    .page-head { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 12px 16px; }
    .title-block { flex: 1 1 240px; min-width: 0; }
    .page-head h1 { margin: 0; font-size: clamp(28px, 4vw, 36px); font-weight: 900; letter-spacing: -0.025em; line-height: 1.12; overflow-wrap: anywhere; }
    .actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
    .btn {
      min-height: 38px; padding: 0 13px; display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 10px; cursor: pointer; text-decoration: none; white-space: nowrap;
      background: var(--card); border: 1px solid var(--line-2); color: var(--ink); font-size: 13px; font-weight: 700;
      box-shadow: 0 1px 2px rgba(16, 24, 40, 0.04); transition: background-color 120ms var(--ease), border-color 120ms var(--ease);
    }
    .btn:hover { background: color-mix(in srgb, var(--card) 92%, var(--ink)); }
    .btn:active { transform: translateY(0.5px); }
    .btn.primary { background: var(--accent); color: var(--on-accent); border-color: transparent; box-shadow: 0 1px 2px rgba(16, 24, 40, 0.1), 0 6px 14px -10px var(--accent); }
    .btn.primary:hover { background: var(--accent-ink); }
    @media (prefers-color-scheme: dark) { .btn.primary { background: #c5050c; } .btn.primary:hover { background: #dc1a21; } }
    .btn.icon-only { width: 38px; padding: 0; }
    .btn.icon-only .icon { width: 16px; height: 16px; }
    .btn .icon { width: 15px; height: 15px; }
    .page-sub { margin: 8px 0 0; color: var(--ink-2); max-width: 680px; font-size: 14.5px; }
    .props { display: grid; grid-template-columns: 128px minmax(0, 1fr); gap: 0 12px; margin: 18px 0 0; font-size: 13px; }
    .props dt { color: var(--ink-3); padding: 5px 0; }
    .props dd { margin: 0; padding: 5px 0; min-width: 0; }
    .summary { margin: 24px 0 8px; font-size: 12.5px; color: var(--ink-3); }

    .pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 7px; border-radius: 5px; background: var(--code); font-size: 12px; color: var(--ink-2); white-space: nowrap; }
    .pill.mono { font-family: var(--mono); font-size: 11.5px; }
    .pill.src { cursor: help; }
    .pill.draft { background: var(--hot-soft); color: var(--ink); }
    .pills { display: inline-flex; flex-wrap: wrap; gap: 5px; }

    /* ---- display cards ---- */
    .cards { display: grid; gap: 14px; }
    .cards > * { min-width: 0; }
    .group-title { margin: 22px 0 -2px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
    .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; scroll-margin-top: 72px; }
    .card.is-flash { box-shadow: 0 0 0 2px var(--accent), 0 0 0 6px var(--accent-soft); }
    .card-head { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; padding: 16px 14px 8px 20px; }
    .card-title { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; flex: 1 1 240px; min-width: 0; }
    .card-head h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -0.012em; }
    .card-head .venue-of { color: var(--ink-3); font-size: 13px; }
    .card-head .processor { font: 11.5px var(--mono); color: var(--ink-3); letter-spacing: 0.02em; }
    .card-head .dims { display: flex; align-items: center; gap: 2px; margin-left: auto; }
    .card-head .dims .size { font-size: 14px; font-weight: 600; color: var(--ink); }
    .card-meta { font-size: 12.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
    .card-props { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 0 20px 14px; font-size: 12.5px; color: var(--ink-3); }
    .card-props > span { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }

    .drawing {
      padding: 30px 20px 14px 48px; border-top: 1px solid var(--line);
      background: var(--well) radial-gradient(circle, var(--grid) 1px, transparent 1.2px) 0 0 / 16px 16px;
    }
    .figure { position: relative; margin: 0 auto; }
    .figure svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; color: var(--ink-3); }
    .figure .canvas { fill: var(--card); stroke: var(--ink-3); stroke-width: 1.25; }
    .hits { position: absolute; inset: 0; }
    .zone-hit {
      position: absolute; display: grid; place-items: center; padding: 0; margin: 0; overflow: hidden; cursor: pointer;
      border: 1px solid var(--zone); border-radius: 0; background: transparent; color: var(--zone); font: inherit;
      container-type: size; transition: background-color 120ms var(--ease);
    }
    .zone-hit.zone-derived { border-style: dashed; }
    .zone-whole { position: absolute; inset: 0; pointer-events: none; }
    .zone-whole.is-hot, .zone-whole.is-picked { z-index: 3; box-shadow: inset 0 0 0 2px var(--ink); background: var(--active); }
    .zone-hit.is-parent { place-items: start; }
    .zone-hit.is-covered .zone-label, .zone-hit.is-crowded .zone-label { visibility: hidden; }
    .zone-hit.is-match { background: var(--active); border-color: var(--ink); color: var(--ink); }
    .zone-hit:hover, .zone-hit:focus-visible, .zone-hit.is-hot, .zone-hit.is-picked { z-index: 2; background: var(--active); border: 2px solid var(--ink); color: var(--ink); outline: none; }
    .zone-hit:hover .zone-label, .zone-hit:focus-visible .zone-label, .zone-hit.is-hot .zone-label, .zone-hit.is-picked .zone-label { visibility: visible; }
    .zone-hit.is-parent:is(:hover, :focus-visible, .is-hot, .is-picked) .zone-label { margin: 2px; border-radius: 4px; background: var(--card); box-shadow: 0 0 0 1px var(--ink); }
    .zone-label { display: grid; gap: 1px; padding: 2px 4px; text-align: center; line-height: 1.15; pointer-events: none; }
    .zone-label b { font-size: 11px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100cqw; }
    .zone-label i { font: normal 10px var(--mono); color: var(--ink-2); white-space: nowrap; }
    @container (max-width: 76px) { .zone-label { display: none; } }
    @container (max-height: 22px) { .zone-label { display: none; } }
    @container (max-height: 40px) { .zone-label i { display: none; } }
    .zone-hit.is-dim { opacity: 0.28; }
    .drawing.is-scroll { overflow-x: auto; overscroll-behavior-x: contain; }
    .drawing.is-scroll .figure { margin: 0; }
    .drawing.is-scroll .zone-hit { place-items: center start; }
    .is-board-view { --wide: 1320px; }
    .card.is-board { overflow: clip; }
    .card.is-board .card-props { padding-top: 14px; }
    .card.is-board .drawing { padding-top: 34px; border-bottom: 1px solid var(--line); }
    .card.is-board .drawing.is-pinned { position: sticky; top: 0; z-index: 4; }
    .card.is-board .zone-row { scroll-margin-top: calc(var(--pin, 0px) + 8px); }
    .card.is-board .drawing + .zones .zone-row:first-child { border-top: 0; }
    .board-link { color: inherit; text-decoration: none; }
    .board-link:hover { text-decoration: underline; text-underline-offset: 3px; }
    .crumb-link { color: var(--ink-2); text-decoration: none; }
    .crumb-link:hover { color: var(--ink); text-decoration: underline; }
    .board-bar { display: grid; gap: 8px; margin: 0 0 12px; }
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .chips-label { min-width: 56px; font-size: 12.5px; color: var(--ink-3); }
    .chip { display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border: 1px solid var(--line); border-radius: 999px; background: var(--card); cursor: pointer; font-size: 13px; color: var(--ink-2); transition: background-color 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); }
    .chip:hover { border-color: var(--line-2); color: var(--ink); }
    .chip[aria-pressed="true"] { background: var(--accent-soft); border-color: color-mix(in srgb, var(--accent) 45%, transparent); color: var(--accent-ink); font-weight: 700; }
    .chip-n { font-size: 11.5px; font-variant-numeric: tabular-nums; }
    .draft-tag { background: var(--hot-soft); color: var(--ink); cursor: help; }
    .pager { display: inline-flex; gap: 4px; }
    .pager-btn { width: 38px; justify-content: center; padding: 0; }
    .pager-btn .icon { width: 15px; height: 15px; }
    .pager-btn:disabled { opacity: 0.4; cursor: default; }
    .zones-empty { margin: 0; padding: 14px 18px; border-top: 1px solid var(--line); font-size: 13px; color: var(--ink-3); }
    .scale { margin: 18px auto 0; }
    .drawing.is-scroll .scale { margin-left: 0; }
    .scale-head { margin: 0 0 6px; font-size: 12px; font-weight: 700; color: var(--ink-2); }
    .scale-list { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px 0; margin: 0; padding: 0; list-style: none; }
    .scale-item { display: grid; gap: 3px; min-width: 0; padding: 0 6px 0 0; border-radius: 4px; }
        .scale-bar { display: grid; align-items: end; width: 100%; min-height: 24px; padding: 0; border: 0; border-radius: 4px; background: transparent; cursor: pointer; }
    .scale-bar::before { content: ""; display: block; width: 100%; aspect-ratio: var(--aw) / var(--ah); min-height: 3px; border: 1px solid var(--zone); border-radius: 1px; background: var(--zone-soft); }
    .scale-item.is-hot .scale-bar::before, .scale-item.is-picked .scale-bar::before { border-color: var(--ink); background: var(--active); }
    .scale-cap { display: grid; font-size: 11.5px; line-height: 1.25; min-width: 0; }
    .scale-cap b, .scale-cap i { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .scale-cap b { font-weight: 700; }
    .scale-cap i { font: normal 11px var(--mono); color: var(--ink-3); }
    .figure .ov-crop { color: var(--warn); }
    .figure .ov-scrim { color: var(--ink-3); }
    .figure .ov-seam { stroke: var(--warn); stroke-width: 1.25; stroke-dasharray: 5 4; }
    .dim { position: absolute; font: 11px var(--mono); color: var(--ink-3); white-space: nowrap; }
    .dim span { background: var(--well); padding: 0 6px; border-radius: 3px; }
    .dim-w { left: 0; right: 0; top: -19px; text-align: center; }
    .dim-w::before { content: ""; position: absolute; left: 0; right: 0; top: 8px; border-top: 1px solid var(--line-2); z-index: -1; }
    .dim-h { left: -38px; top: 0; bottom: 0; width: 30px; display: grid; place-items: center; }
    .dim-h::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; border-left: 1px solid var(--line-2); z-index: -1; }
    .dim-h span { writing-mode: vertical-rl; transform: rotate(180deg); }
    .legend { display: flex; flex-wrap: wrap; gap: 4px 16px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 12px; color: var(--ink-3); }
    .legend li { display: inline-flex; align-items: center; gap: 7px; }
    .key { display: inline-block; width: 14px; height: 9px; border: 1px solid var(--zone); border-radius: 2px; }
    .key-derived { border-style: dotted; }
    .key-crop { border-color: var(--warn); background: repeating-linear-gradient(45deg, var(--warn-soft) 0 2px, transparent 2px 4px); }
    .key-scrim { border-color: var(--ink-3); background: repeating-linear-gradient(45deg, var(--active) 0 2px, transparent 2px 4px); }
    .key-seam, .key-break { height: 0; border: 0; border-top: 2px dashed var(--warn); border-radius: 0; }
    .fig-note { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-3); }
    .fig-link { display: inline-flex; margin-top: 6px; font-size: 13px; color: var(--zone); text-decoration: none; }
    .fig-link:hover { text-decoration: underline; }

    .zone-row, .t-row { display: grid; grid-template-columns: 52px minmax(0, 1fr) auto auto; align-items: center; gap: 2px 12px; padding: 10px 12px 10px 20px; border-top: 1px solid var(--line); transition: background-color 120ms var(--ease); }
    .zone-row { cursor: pointer; }
    .zone-row:hover, .zone-row.is-match, .zone-row.is-hot, .zone-row.is-picked, .t-row:hover { background: var(--hover); }
    .zone-row.is-hot, .zone-row.is-picked { box-shadow: inset 3px 0 0 var(--zone); }
    .thumb { width: 52px; height: 28px; display: grid; place-items: center; }
    .thumb .shape { display: block; border: 1px solid var(--zone); background: var(--zone-soft); border-radius: 2px; min-width: 2px; min-height: 2px; }
    .thumb .board { position: relative; display: block; border: 1px solid var(--line-2); border-radius: 2px; background: var(--well); }
    .thumb .board b { position: absolute; display: block; background: var(--zone); opacity: 0.85; border-radius: 1px; min-width: 2px; min-height: 2px; }
    .zone-row.is-hot .thumb .board b, .zone-row.is-picked .thumb .board b { background: var(--ink); opacity: 1; }
    .zone-line { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; }
    .zone-line .tags { margin-left: 0; }
    .zone-name b, .t-name b { font-weight: 700; word-break: break-word; }
    .tags { display: inline-flex; flex-wrap: wrap; gap: 4px; margin-left: 8px; vertical-align: 1px; }
    .tag { font-size: 11px; padding: 0 6px; border-radius: 4px; background: var(--code); color: var(--ink-2); }
    .tag.warn { background: var(--warn-soft); color: var(--warn); }
    .zone-meta, .t-sub { display: block; font: 11.5px var(--mono); color: var(--ink-3); margin-top: 3px; }
    .zone-meta .zone-id { margin-right: 10px; }
    .tag.layers { font-family: var(--mono); font-size: 10.5px; letter-spacing: 0.02em; }
    .zone-notes { margin: 3px 0 0; padding: 0 0 0 14px; font-size: 12.5px; color: var(--ink-2); }
    .zone-notes li.red { color: var(--warn); }
    .size { min-height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 7px; border: 1px solid transparent; border-radius: 9px; background: var(--code); cursor: pointer; font: 500 13px var(--mono); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; transition: background-color 120ms var(--ease), border-color 120ms var(--ease), color 120ms var(--ease); }
    .size:hover { background: var(--zone-soft); color: var(--zone); }
    .size.is-copied { background: var(--zone-soft); border-color: color-mix(in srgb, var(--zone) 45%, transparent); color: var(--zone); }
    .size .icon { width: 14px; height: 14px; color: currentColor; opacity: 0.7; }
    .menu { position: relative; }
    .menu > summary { list-style: none; }
    .menu > summary::-webkit-details-marker { display: none; }
    .menu > summary.dots { width: 36px; min-height: 36px; padding: 0; border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-3); }
    .menu > summary.dots:hover, .menu[open] > summary.dots { background: var(--hover); color: var(--ink); }
    .menu-pop { position: absolute; right: 0; top: calc(100% + 4px); z-index: 25; min-width: 200px; padding: 5px; background: var(--card); border-radius: 12px; box-shadow: var(--pop-shadow); animation: pop-in 140ms var(--ease); }
    @keyframes pop-in { from { opacity: 0; transform: translateY(-3px) scale(0.98); } to { opacity: 1; transform: none; } }
    .menu-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 38px; padding: 0 10px; border: 0; border-radius: 8px; background: transparent; cursor: pointer; text-align: left; font: inherit; font-size: 13.5px; color: var(--ink); }
    .menu-item .icon { color: var(--ink-3); }
    .menu-item:hover, .menu-item:focus-visible { background: var(--hover); outline: none; }
    .mini { width: 36px; height: 36px; display: grid; place-items: center; border: 0; border-radius: 9px; background: transparent; cursor: pointer; color: var(--ink-3); text-decoration: none; }
    .mini:hover { background: var(--hover); color: var(--ink); }

    .card-foot { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 8px; padding: 10px 14px 12px 20px; border-top: 1px solid var(--line); }
    .notes { list-style: none; margin: 0; padding: 0; flex: 1 1 280px; font-size: 12.5px; }
    .notes li { display: flex; gap: 8px; padding: 2px 0; color: var(--ink-2); }
    .notes li::before { content: ""; flex: none; width: 6px; height: 6px; margin-top: 7px; border-radius: 50%; background: var(--line-2); }
    .notes li.is-open { color: var(--warn); }
    .notes li.is-open::before { background: var(--warn); }
    .foot-actions { margin-left: auto; display: flex; gap: 6px; }

    /* ---- venue overview: every display on one scale ---- */
    .overview { padding: 16px 12px 10px 20px; background: var(--card); border-radius: 14px; box-shadow: var(--shadow); }
    .overview-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; margin-bottom: 6px; }
    .overview-head span { font-size: 13.5px; font-weight: 700; }
    .overview-head small { font-size: 12px; color: var(--ink-3); }
    .overview-strip { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 4px; }
    .ov-item { display: grid; grid-template-rows: var(--tile-h, 40px) auto; gap: 7px; align-content: start; padding: 9px 8px 10px; border: 0; border-radius: 10px; background: none; cursor: pointer; color: inherit; font: inherit; text-align: left; }
    .ov-item:hover, .ov-item:focus-visible { background: var(--hover); }
    .ov-item:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--accent); }
    #title:focus { outline: none; }
    .ov-item > .ov-tile { align-self: end; }
    .ov-tile { display: block; border-radius: 1.5px; background: var(--zone-soft); box-shadow: inset 0 0 0 1px var(--zone); transition: background-color 140ms var(--ease), box-shadow 140ms var(--ease); }
    .ov-tile.has-issue { background: var(--warn-soft); box-shadow: inset 0 0 0 1px var(--warn); }
    .ov-item:hover .ov-tile, .ov-item:focus-visible .ov-tile { background: var(--active); box-shadow: inset 0 0 0 1px var(--ink); }
    .ov-cap { display: grid; line-height: 1.25; }
    .ov-cap b { font-size: 12.5px; font-weight: 700; }
    .ov-cap i { font: normal 11px var(--mono); color: var(--ink-3); }

    /* ---- ids, keys, issues ---- */
    .ids { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 6px; }
    .id-pill { border: 0; cursor: copy; color: var(--ink); }
    .id-pill:hover, .zone-id:hover { background: var(--active); }
    .id-pill.is-copied, .zone-id.is-copied { box-shadow: inset 0 0 0 1px var(--ink); }
    .key-pill { background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
    .tag.mono { font-family: var(--mono); font-size: 10.5px; background: transparent; box-shadow: inset 0 0 0 1px var(--line-2); }
    .zone-id { min-height: 32px; padding: 4px 6px; margin-left: -6px; border: 0; border-radius: 4px; background: transparent; cursor: copy; font: 11.5px var(--mono); color: var(--ink-2); text-align: left; }
    .row-tools { display: inline-flex; }
    .zone-row { scroll-margin-top: 120px; }
    .zone-row.is-flash { background: var(--active); }
    .notes li b, .zone-notes li b { font-weight: 700; }
    .size.static { cursor: default; }
    .size.static:hover { background: transparent; border-color: transparent; }

    /* ---- reference pages ---- */
    .doc { padding-bottom: 6px; }
    .doc-list { margin: 0; padding: 4px 20px 12px 38px; font-size: 13.5px; color: var(--ink-2); }
    .doc-list li { padding: 3px 0; }
    .doc-list.changes { list-style: none; padding-left: 16px; }
    .doc-list.changes .pill { margin-right: 4px; }
    .file-ico { font: 600 9.5px var(--mono); color: var(--zone); }
    .warn-ico { color: var(--warn); }
    .warn-ico .icon { width: 16px; height: 16px; }
    .file-row a { font-family: var(--mono); font-size: 13.5px; }
    .snippet { margin: 0 20px 14px; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    .snippet-head { display: flex; align-items: center; justify-content: space-between; padding: 2px 4px 2px 12px; background: var(--well); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--ink-3); }
    .snippet pre { margin: 0; padding: 10px 12px; overflow-x: auto; font: 12px/1.55 var(--mono); color: var(--ink); white-space: pre; }
    .snippet pre.wrap { white-space: pre-wrap; }

    /* ---- content type view ---- */
    .targets { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
    .targets h2 { display: flex; justify-content: space-between; margin: 0; padding: 10px 20px; font-size: 12.5px; font-weight: 700; color: var(--ink-3); background: var(--well); border-top: 1px solid var(--line); }
    .targets h2:first-child { border-top: 0; }
    .targets h2 small { font-weight: 400; }
    .t-name a { color: var(--ink); text-decoration: none; }
    .t-name a:hover { text-decoration: underline; }
    .t-sub { font-family: var(--font); font-size: 12px; }

    .empty { margin-top: 30px; padding: 32px 24px; border: 1px dashed var(--line-2); border-radius: 14px; background: var(--card); text-align: center; color: var(--ink-2); }
    .toast {
      position: fixed; left: 50%; bottom: calc(22px + env(safe-area-inset-bottom)); transform: translate(-50%, 16px); opacity: 0; pointer-events: none; z-index: 30;
      max-width: calc(100vw - 32px); padding: 10px 16px; border-radius: 12px; background: var(--ink); color: var(--bg); font-size: 13px; font-weight: 700; box-shadow: 0 12px 30px -12px rgba(0, 0, 0, 0.45);
      transition: opacity 180ms var(--ease), transform 180ms var(--ease);
    }
    .toast.is-on { opacity: 1; transform: translate(-50%, 0); }
    .footnote { margin: 36px 0 0; font-size: 12px; color: var(--ink-3); }

    /* ---- newcomers: technical details, terms, guided start ---- */
    .hide-tech .card-props, .hide-tech .processor, .hide-tech .zone-id, .hide-tech .tag.mono, .hide-tech .key-pill { display: none; }
    .hide-tech .card.is-board .drawing { border-top: 0; }
    .tech-toggle .switch { position: relative; width: 28px; height: 16px; flex: none; border-radius: 999px; background: var(--line-2); transition: background-color 140ms var(--ease); }
    .tech-toggle .switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, 0.25); transition: transform 160ms var(--ease); }
    .tech-toggle[aria-pressed="true"] .switch { background: var(--accent); }
    .tech-toggle[aria-pressed="true"] .switch::after { transform: translateX(12px); }
    .has-term { text-decoration: underline dotted color-mix(in srgb, currentColor 45%, transparent); text-underline-offset: 3px; cursor: help; }
    .terms { display: grid; grid-template-columns: minmax(130px, 200px) minmax(0, 1fr); margin: 0; padding: 4px 20px 14px; font-size: 14px; }
    .terms dt { padding: 9px 12px 9px 0; font-weight: 700; border-top: 1px solid var(--line); }
    .terms dd { margin: 0; padding: 9px 0; color: var(--ink-2); border-top: 1px solid var(--line); }
    .terms dt:first-of-type, .terms dd:first-of-type { border-top: 0; }
    .start { padding: 18px 20px 16px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
    .start-head h2 { margin: 0; font-size: 17px; font-weight: 900; letter-spacing: -0.012em; }
    .start-head p { margin: 3px 0 12px; font-size: 13.5px; color: var(--ink-2); }
    .start-head a { color: var(--accent-ink); font-weight: 700; text-decoration: none; }
    .start-head a:hover { text-decoration: underline; text-underline-offset: 3px; }
    .start-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .start-item { display: grid; gap: 2px; min-width: 150px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); text-decoration: none; cursor: pointer; transition: border-color 120ms var(--ease), background-color 120ms var(--ease); }
    .start-item:hover { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: var(--accent-soft); }
    .start-more[open] > .start-item { width: max-content; border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
    .start-item b { font-size: 14px; font-weight: 700; }
    .start-item i { font-style: normal; font-size: 12px; color: var(--ink-3); }
    .start-more > summary { list-style: none; }
    .start-more > summary::-webkit-details-marker { display: none; }
    .start-more > summary b::after { content: " ▾"; font-size: 11px; color: var(--ink-3); }
    .start-more[open] { flex-basis: 100%; }
    .start-more[open] > summary b::after { content: " ▴"; }
    .start-games { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px 18px; margin-top: 12px; }
    .start-group h3 { margin: 0 0 6px; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; color: var(--ink-3); }
    .start-group { display: grid; gap: 4px; align-content: start; }
    .start-item.is-small { min-width: 0; padding: 7px 10px; border-radius: 9px; }
    .start-item.is-small b { font-size: 13px; }
    .made .chip { text-decoration: none; color: var(--ink); }

    /* ---- art preview ---- */
    .btn.ghost { min-height: 32px; padding: 0 10px; border-color: transparent; background: transparent; box-shadow: none; color: var(--ink-2); font-weight: 700; }
    .btn.ghost:hover { background: var(--hover); color: var(--ink); }
    /* The tray: one card per piece in a row that scrolls sideways, so a full
       system of pieces never pushes the board far down the page. */
    .art-tray { display: grid; gap: 10px; padding: 12px; border-radius: 14px; background: var(--card); box-shadow: var(--shadow); }
    .art-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .art-title { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .art-title b { font-size: 14px; font-weight: 900; }
    .art-sum { font-size: 13px; color: var(--ink-3); }
    .art-tools { display: flex; align-items: center; gap: 4px; margin-left: auto; }
    .art-tools .chip { min-height: 32px; }
    .art-tools .btn .icon { width: 14px; height: 14px; }
    .art-list { display: flex; gap: 8px; margin: 0 -12px; padding: 0 12px 2px; overflow-x: auto; list-style: none; scrollbar-width: thin; }
    .art-item { position: relative; display: grid; grid-template-columns: 64px minmax(0, 1fr); grid-template-rows: auto auto; gap: 8px 10px; flex: none; width: 300px; padding: 10px 34px 10px 10px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
    .art-thumb { position: relative; width: 64px; height: 44px; overflow: hidden; border-radius: 6px; background: #0b0d10 center / contain no-repeat; box-shadow: inset 0 0 0 1px var(--line); }
    .art-thumb video { display: block; width: 100%; height: 100%; object-fit: contain; }
    .art-kind { position: absolute; left: 4px; bottom: 3px; padding: 1px 4px; border-radius: 4px; background: rgba(0, 0, 0, 0.62); color: #fff; font-size: 9.5px; font-weight: 700; letter-spacing: 0.02em; }
    .art-text { display: grid; align-content: start; gap: 1px; min-width: 0; }
    .art-text b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; }
    .art-text i { font: normal 11.5px var(--mono); color: var(--ink-3); }
    .art-note { margin-top: 3px; font-size: 12.5px; line-height: 1.35; color: var(--ink-2); }
    .art-note::before { content: ""; display: inline-block; width: 7px; height: 7px; margin-right: 6px; border-radius: 50%; background: #2e9e5b; vertical-align: 1px; }
    .art-item.is-off { border-color: color-mix(in srgb, var(--hot) 35%, var(--line)); }
    .art-item.is-off .art-note::before { background: var(--hot); }
    .art-place { grid-column: 1 / -1; min-height: 32px; width: 100%; padding: 0 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); font: inherit; font-size: 13px; }
    .art-place:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
    .art-rm { position: absolute; top: 6px; right: 6px; width: 26px; min-height: 26px; padding: 0; }
    .art-rm .icon { width: 13px; height: 13px; }
    svg .art-video { display: block; width: 100%; height: 100%; object-fit: fill; }
    .zone-hit.is-drop { z-index: 3; background: color-mix(in srgb, var(--accent) 22%, transparent); border: 2px solid var(--accent); }
    .zone-hit.is-drop .zone-label { visibility: visible; }
    .drawing.hide-zones .zone-hit:not(:hover):not(:focus-visible):not(.is-picked) { border-color: transparent; }
    .drawing.hide-zones .zone-hit:not(:hover):not(:focus-visible):not(.is-picked) .zone-label { visibility: hidden; }
    .drawing.has-art .zone-label { border-radius: 4px; background: color-mix(in srgb, var(--card) 86%, transparent); }
    .drawing.has-art .zone-hit { border-color: color-mix(in srgb, var(--zone) 70%, #fff); }
    .art-target { position: relative; }
    /* While dragging, a dashed frame with the hint on top; the drawing stays
       visible so the zone under the pointer can light up. */
    .art-target::after { content: ""; position: absolute; inset: 0; z-index: 6; display: none; border: 2px dashed var(--accent); border-radius: 12px; pointer-events: none; }
    .art-target::before { content: attr(data-drop); position: absolute; top: 10px; left: 50%; z-index: 7; display: none; transform: translateX(-50%); max-width: calc(100% - 24px); padding: 5px 12px; border-radius: 999px; background: var(--accent); color: #fff; font-size: 12.5px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none; }
    .is-dragging .art-target::after, .is-dragging .art-target::before { display: block; }

    /* ---- Shared tool header (v4): the tool's name top left, Apps top right.
       Shared byte-for-byte by every public tool; colours follow the page's
       own text colour. ---- */
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; color: inherit; }
    .brand-mark { width: 28px; height: 28px; flex: none; border-radius: 8px; overflow: hidden; box-shadow: 0 0 0 1px color-mix(in srgb, currentColor 18%, transparent); }
    .brand-mark svg { display: block; width: 28px; height: 28px; }
    .brand-name { overflow: hidden; text-overflow: ellipsis; font-weight: 900; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
    .wc-apps {
      display: inline-flex; align-items: center; gap: 6px; flex: none; margin-left: auto; min-height: 34px; padding: 0 12px; border-radius: 9px;
      color: inherit; text-decoration: none; font-size: 14px; font-weight: 700; line-height: 1;
      background: color-mix(in srgb, currentColor 8%, transparent); border: 1px solid color-mix(in srgb, currentColor 16%, transparent);
      transition: background 150ms ease;
    }
    .wc-apps:hover { background: color-mix(in srgb, currentColor 15%, transparent); }
    .wc-apps svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.6; opacity: 0.8; }

    /* ---- phones ---- */
    @media (max-width: 900px) {
      main { padding-top: 24px; }
    }
    @media (max-width: 1199px) {
      /* Below desktop width the reference links fold into a menu beside the
         brand; the search takes its own row, venues scroll sideways under it. */
      .topbar-in { padding-top: 10px; }
      .brand { order: 0; }
      .wc-apps { order: 1; }
      .btn.menu-toggle { order: 2; display: inline-flex; }
      .search { order: 3; width: 100%; }
      .top-links { order: 2; display: none; position: absolute; right: clamp(16px, 4vw, 56px); top: 50px; z-index: 30; flex-direction: column; align-items: stretch; min-width: 220px; padding: 6px; border-radius: 14px; background: var(--card); box-shadow: var(--pop-shadow); }
      .top-links.is-open { display: flex; animation: pop-in 140ms var(--ease); }
      .top-links .nav { flex-direction: column; }
      .top-links .nav button, .top-links a { width: 100%; min-height: 42px; justify-content: space-between; font-size: 14px; }
      .search input { height: 40px; font-size: 16px; }
    }
    @media (max-width: 560px) {
      .zone-row, .t-row { grid-template-columns: 52px minmax(0, 1fr) auto; align-items: start; padding: 12px 8px 12px 14px; column-gap: 10px; }
      .zone-row .size, .t-row .size { grid-column: 2; grid-row: 2; justify-self: start; margin: 6px 0 0; }
      .zone-row .menu, .t-row .menu, .t-row .mini { grid-column: 3; grid-row: 1; }
      .thumb { margin-top: 2px; }
      .overview { padding: 14px 0 8px 14px; }
      .overview-head { padding-right: 14px; }
      .overview-strip { display: flex; overflow-x: auto; scroll-snap-type: x proximity; scrollbar-width: none; padding-right: 14px; }
      .overview-strip::-webkit-scrollbar { display: none; }
      .ov-item { flex: none; width: 136px; scroll-snap-align: start; }
      .drawing { padding: 22px 12px 12px 36px; }
      .card-head { padding: 14px 10px 8px 14px; }
      .card-props { padding: 0 14px 12px; }
      .card-foot { padding: 10px 10px 12px 14px; }
      .card-head .dims { margin-left: 0; width: 100%; }
      .props { grid-template-columns: 96px minmax(0, 1fr); }
      .page-head { align-items: flex-start; }
      .is-board-view .page-head .actions { width: 100%; }
      .is-board-view .page-head .actions .primary { flex: 1; }
      .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px 2px; }
      .chips::-webkit-scrollbar { display: none; }
      .chip, .chips .tag { flex: none; }
      .chips-label { flex: none; min-width: 0; margin-right: 4px; }
      .is-board-view .page-head .actions .art-btn { order: 3; flex: 1; }
      .art-tools { margin-left: 0; width: 100%; }
      .art-item { width: min(300px, 82vw); }
      .start { padding: 16px 14px 14px; }
      .start-row { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -14px; padding: 0 14px 2px; }
      .start-row::-webkit-scrollbar { display: none; }
      .start-row > * { flex: none; }
      .start-more[open] { flex: 1 0 100%; }
      .start-row:has(.start-more[open]) { flex-wrap: wrap; overflow: visible; }
      .terms { grid-template-columns: 1fr; }
      .terms dd { padding-top: 0; border-top: 0; }
    }
    @media (hover: none) { .search kbd { display: none; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition-duration: 0.01ms !important; } }
  </style>
</head>

  <a class="skip" href="#content">Skip to content</a>
  <div class="app">
    <header class="topbar">
      <div class="topbar-in">
        <span class="brand">
