<!doctype html>
<!-- OTS router output: a 1920x1080 frame for a laptop (Chrome, full screen) -> HDMI -> SDI into the video router. Canonical source: edit here. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="robots" content="noindex">
<title>OTS router output</title>
<!--
  Both boards at native pixels on black, so the router/Show Control can crop each region 1:1 with no scaling:
    fascia  825 x 60   at x=0,  y=0     (camp-randall/south-upper-fascia/angle)
    chip    312 x 176  at x=0,  y=120   (corner chip for camp-randall/north-board/main-video-fg), square corners
  Move a region with ?fascia=x,y or ?chip=x,y; hide one with ?fascia=off or ?chip=off.
  Both follow the controller at /ots/control. ?demo=<scenario> passes through to both for testing.
-->
<style>
  html, body { margin: 0; padding: 0; width: 1920px; height: 1080px; background: #000; overflow: hidden; cursor: none; }
  iframe { position: absolute; border: 0; background: transparent; }
  #fascia { width: 825px; height: 60px; left: 0; top: 0; }
  #chip { width: 312px; height: 176px; left: 0; top: 120px; }
</style>
</head>
<body>
<iframe id="fascia" title="OTS fascia board" scrolling="no"></iframe>
<iframe id="chip" title="OTS corner chip" scrolling="no"></iframe>
<script src="output.js?v=82137332b6cc"></script>
</body>
</html>
