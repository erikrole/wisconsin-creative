<!doctype html>
<!-- World Series corner chip for the North Board main video. Same data and controller as the fascia board (board.js). Canonical source: edit here. Run `node scripts/hash-static-tools.mjs` after changing board.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=312, height=176">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.mlbstatic.com; connect-src 'self' https://statsapi.mlb.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>World Series chip</title>
<!--
  Corner chip, 312x176, for camp-randall/north-board/main-video-fg (3096x1440, manifest 2026-10-09.1),
  top left, inset 155 px from the left and 72 px from the top. Logos, scores, inning and outs.
  Takes the same URL options as index.html (?demo=, ?game=, ?scale=, ?control=0), plus ?square=1 for square
  corners when the chip goes out over HDMI/SDI with no alpha (rounded corners would show black).
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
  :root { --gold: #FFC52F; --dim: #7f8ea8; --muted: #a9b4c7; --off: #343d4d; --ink: #ffffff; }
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; }
  body { width: 312px; height: 176px; }
  #board { position: relative; width: 312px; height: 176px; display: flex; border-radius: 16px; overflow: hidden; background: #07090d; color: var(--ink);
    font-family: 'Gotham XNarrow', 'Gotham Narrow', 'Barlow Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-variant-numeric: tabular-nums;
    -webkit-font-smoothing: antialiased; transform-origin: 0 0; box-shadow: inset 0 0 0 2px rgba(255,255,255,0.08); }
  .teams { width: 184px; flex-shrink: 0; display: flex; flex-direction: column; }
  .team { height: 88px; display: flex; align-items: center; }
  .logo { width: 88px; height: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .logo img { display: block; transform: scale(1.35); }
  .logo .tbd { width: 56px; height: 56px; border-radius: 50%; border: 2px solid #56627a; box-sizing: border-box; display: flex; align-items: center; justify-content: center; font-size: 15px; letter-spacing: 1px; color: var(--muted); }
  .city { display: none; }                                         /* the chip shows logos only */
  .score { width: 96px; height: 88px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 62px; font-weight: 800; letter-spacing: -2px; }
  .lost .score { color: var(--dim); }
  .won .score { color: var(--gold); }
  .panel { flex-grow: 1; display: flex; align-items: center; justify-content: center; background: linear-gradient(180deg, #161b25 0%, #07090d 100%); }
  .mode { display: none; flex-direction: column; align-items: center; }
  .is-live .m-live, .is-break .m-break, .is-label .m-label { display: flex; }
  .m-live > * + * { margin-top: 11px; }
  .inning { display: flex; align-items: center; margin-left: -5px; }
  .inning > * + * { margin-left: 8px; }
  #arrow { transition: transform .5s cubic-bezier(.4,0,.2,1); }
  #arrow.down { transform: rotate(180deg); }
  .num { font-size: 51px; line-height: 51px; }
  .outs { display: flex; }
  .outs i { width: 14px; height: 14px; border-radius: 50%; background: var(--off); transition: background-color .3s ease; }
  .outs i + i { margin-left: 10px; }
  .outs i.on { background: var(--gold); }
  .hidden { display: none; }                                       /* bases and count exist for board.js but the chip doesn't show them */
  .lbl { font-size: 18px; letter-spacing: 4px; margin-right: -4px; line-height: 18px; color: var(--gold); }
  .lbl.muted { color: var(--muted); }
  .m-break > * + *, .m-label > * + * { margin-top: 6px; }
  .main { font-size: 30px; line-height: 32px; letter-spacing: 1px; white-space: nowrap; }
  .main.gold { color: var(--gold); }
  @keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @keyframes rollIn { from { opacity: 0; transform: translateY(25%); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes outOn { 0% { transform: scale(.7); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  .enter { animation: enter .4s cubic-bezier(.2,.7,.2,1) both; }
  .roll { display: inline-block; animation: rollIn .4s cubic-bezier(.2,.7,.2,1) both; }
  .fade { animation: fadeIn .5s ease both; }
  .outs i.pop { animation: outOn .35s cubic-bezier(.2,.7,.2,1) both; }
  #board.stale::after { content: ''; position: absolute; left: 6px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: #c0392b; }
</style>
</head>
<body>
<div id="board" class="chip is-label pre">
  <div class="teams">
    <div class="team away" id="away"><div class="logo" id="awayLogo"></div><div class="city" id="awayCity"></div><div class="score" id="awayScore"></div></div>
    <div class="team home" id="home"><div class="logo" id="homeLogo"></div><div class="city" id="homeCity"></div><div class="score" id="homeScore"></div></div>
  </div>
  <div class="panel">
    <div class="mode m-live">
      <div class="inning">
        <svg id="arrow" width="22" height="19" viewBox="0 0 14 12" aria-hidden="true"><path d="M7 0 L14 12 L0 12 Z" fill="#FFC52F"/></svg>
        <div class="num" id="inning"></div>
      </div>
      <div class="outs" role="img" aria-label="Outs"><i id="o1"></i><i id="o2"></i><i id="o3"></i></div>
      <div class="hidden" aria-hidden="true">
        <svg><g id="b1"><rect/></g><g id="b2"><rect/></g><g id="b3"><rect/></g></svg>
        <span id="balls"></span><span id="strikes"></span>
      </div>
    </div>
    <div class="mode m-break"><div class="lbl" id="breakWord"></div><div class="num" id="breakInning"></div></div>
    <div class="mode m-label"><div class="lbl" id="label"></div><div class="main" id="main"></div></div>
  </div>
</div>
<script src="board.js?v=1c4e1ae09a27"></script>
</body>
</html>
