<!doctype html>
<!-- OTS board controller. Canonical source: edit here. Run `node scripts/hash-static-tools.mjs` after changing control.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; connect-src 'self'; frame-src 'self'; img-src 'self' data:; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>OTS controller</title>
<style>
  :root { --bg: #101318; --panel: #1a1f27; --line: #2c3340; --ink: #edf0f5; --muted: #9aa5b5; --gold: #FFC52F; --navy: #12284B; --red: #e5484d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 900px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; font-weight: 600; }
  .preview { width: 100%; aspect-ratio: 825 / 60; background: #07090d; border-radius: 6px; overflow: hidden; position: relative; }
  .preview iframe { position: absolute; left: 0; top: 0; width: 825px; height: 60px; border: 0; transform-origin: 0 0; }
  .modes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .mode { font: inherit; color: var(--ink); background: #232a35; border: 2px solid transparent; border-radius: 10px; padding: 14px 10px; min-height: 64px; cursor: pointer; text-align: left; }
  .mode strong { display: block; font-size: 16px; }
  .mode span { display: block; color: var(--muted); font-size: 13px; }
  .mode[aria-pressed="true"] { border-color: var(--gold); background: #2a2a1f; }
  .field { margin-top: 14px; }
  label { display: block; font-size: 14px; color: var(--muted); margin-bottom: 6px; }
  select, input { width: 100%; font: inherit; color: var(--ink); background: #232a35; border: 1px solid var(--line); border-radius: 8px; padding: 12px; min-height: 48px; }
  select:disabled, input:disabled { opacity: .45; }
  .actions { display: flex; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .apply { font: inherit; font-weight: 600; color: #101318; background: var(--gold); border: 0; border-radius: 10px; padding: 12px 22px; min-height: 48px; cursor: pointer; }
  .apply:disabled { opacity: .5; cursor: default; }
  .status { color: var(--muted); font-size: 14px; }
  .status.error { color: var(--red); }
  .signin { display: none; }
  .signin a { color: var(--gold); }
  body.signed-out .signin { display: block; }
  body.signed-out .controls { display: none; }
  .meta { color: var(--muted); font-size: 14px; margin-top: 10px; }
  a { color: var(--gold); }
  @media (max-width: 520px) { .modes { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>OTS board controller</h1>
  <p class="sub">World Series out-of-town board on the Camp Randall south end zone fascia. Changes reach the board within about 5 seconds.</p>

  <section>
    <h2>On the board now</h2>
    <div class="preview" id="preview"><iframe id="frame" title="Live board" src="index.html"></iframe></div>
    <p class="meta" id="meta">Loading…</p>
  </section>

  <section class="signin" id="signin">
    <h2>Sign in</h2>
    <p>Sign in with your Wisconsin Creative staff account to change the board. <a id="signinLink" href="/login?returnTo=%2Fots%2Fcontrol">Sign in</a></p>
  </section>

  <section class="controls">
    <h2>Change the board</h2>
    <div class="modes" role="group" aria-label="Board mode">
      <button type="button" class="mode" data-mode="live" aria-pressed="false"><strong>Live</strong><span>Follow the MLB game feed</span></button>
      <button type="button" class="mode" data-mode="demo" aria-pressed="false"><strong>Demo</strong><span>Play a sample scenario</span></button>
      <button type="button" class="mode" data-mode="hold" aria-pressed="false"><strong>Hold</strong><span>Freeze what's on screen</span></button>
    </div>
    <div class="field">
      <label for="scenario">Demo scenario</label>
      <select id="scenario">
        <option value="cycle">Every state, in game order</option>
        <option value="game">Whole night, fast</option>
        <option value="walkoff">Walk-off single</option>
        <option value="slam">Grand slam</option>
        <option value="comeback">Comeback</option>
        <option value="extras">Extra innings</option>
        <option value="sim">Half inning, pitch by pitch</option>
        <option value="pre-tbd">Hold: pregame, opponent TBD</option>
        <option value="pre-cle">Hold: pregame vs Cleveland</option>
        <option value="live">Hold: top 7, runners on</option>
        <option value="mid">Hold: middle of the 7th</option>
        <option value="top9">Hold: top 9, bases loaded</option>
        <option value="final">Hold: final</option>
        <option value="final-10">Hold: final in 10</option>
      </select>
    </div>
    <div class="field">
      <label for="gamePk">MLB game ID for Live (leave blank for World Series Game 2)</label>
      <input id="gamePk" inputmode="numeric" autocomplete="off" placeholder="849802">
    </div>
    <div class="actions">
      <button type="button" class="apply" id="apply">Update board</button>
      <span class="status" id="status" role="status" aria-live="polite"></span>
    </div>
  </section>
</main>
<script src="control.js?v=f1cc59328c56"></script>
</body>
</html>
