<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; frame-src 'self'; base-uri 'none'; object-src 'none'">
<title>OTS game scenarios</title>
<!-- Review page: plays every scripted game on the real board (index.html?demo=...) side by side. Not for the display. -->
<style>
  :root { --bg: #14171d; --panel: #1c2028; --ink: #e8ecf2; --muted: #9aa5b5; --gold: #FFC52F; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.4 system-ui, -apple-system, sans-serif; }
  main { max-width: 1720px; margin: 0 auto; padding: 28px 24px 48px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; }
  .controls { display: flex; gap: 8px; }
  button { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid #343a46; border-radius: 6px; padding: 8px 14px; cursor: pointer; }
  button:hover { border-color: var(--gold); }
  button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  section { background: var(--panel); border-radius: 10px; padding: 16px 18px 18px; margin-bottom: 16px; }
  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  h2 { font-size: 16px; margin: 0; }
  p { margin: 2px 0 0; color: var(--muted); font-size: 14px; }
  .frame { overflow: hidden; border-radius: 4px; background: #07090d; }
  iframe { display: block; border: 0; width: 825px; height: 60px; transform-origin: 0 0; }
</style>
</head>
<body>
<main>
  <header>
    <h1>World Series Game 2 · OTS game scenarios</h1>
    <div class="controls">
      <button type="button" id="z1" aria-pressed="false">1x</button>
      <button type="button" id="z2" aria-pressed="true">2x</button>
      <button type="button" id="restart">Restart all</button>
    </div>
  </header>
  <div id="list"></div>
</main>
<script src="scenarios.js?v=d3a08c64c41e"></script>
</body>
</html>
