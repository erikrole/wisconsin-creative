<!doctype html>
<!-- World Series OTS board. Canonical source: edit here. Run `node scripts/hash-static-tools.mjs` after changing board.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=825, height=60">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://www.mlbstatic.com; connect-src 'self' https://statsapi.mlb.com; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>World Series OTS</title>
<!--
  World Series out-of-town board, design A2.
  Board: camp-randall/south-upper-fascia/angle, 825x60, 60 fps (board manifest 2026-10-09.1).
  Data: MLB Stats API live feed. Every 5 s live, 30 s before first pitch, 5 min once final.

  URL options
    ?game=849802   MLB gamePk (default: World Series Game 2, Sat Oct 24 2026)
    ?poll=5        seconds between live updates
    ?gameno=2      series game number override (normally read from MLB's schedule)
    ?demo=1        cycle through every scenario with sample data (no network)
    ?demo=live     pin one demo scenario (see DEMO below for names)
    ?demo=sim      play a half inning pitch by pitch to show the in-play animations
    ?demo=walkoff  scripted games: walkoff | slam | extras | comeback | game (see GAMES); scenarios.html plays them all
    ?feed=URL      read a saved feed JSON instead of the live one (testing)
    ?scale=2       zoom for review on a laptop; leave off on the board
-->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&display=swap">
<style>
  :root {
    --bg: #07090d;
    --gold: #FFC52F;
    --ink: #ffffff;
    --dim: #7f8ea8;
    --muted: #a9b4c7;
    --off: #343d4d;
    --edge: #56627a;
  }
  html, body { margin: 0; padding: 0; background: var(--bg); overflow: hidden; }
  body { width: 825px; height: 60px; }
  #board {
    position: relative; width: 825px; height: 60px; display: flex; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Gotham XNarrow', 'Gotham Narrow', 'Barlow Condensed', 'Arial Narrow', sans-serif;
    font-weight: 700; font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased; transform-origin: 0 0;
  }

  /* Team fields */
  .team { width: 320px; height: 60px; flex-shrink: 0; display: flex; align-items: center; }
  .team.home { flex-direction: row-reverse; }
  .logo { width: 70px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
  .logo img { display: block; }
  .logo .tbd { width: 40px; height: 40px; border-radius: 50%; border: 2px solid var(--edge); box-sizing: border-box;
    display: flex; align-items: center; justify-content: center; font-size: 12px; letter-spacing: 1px; color: var(--muted); }
  .city { flex-grow: 1; min-width: 0; font-size: 30px; letter-spacing: 1px; white-space: nowrap; overflow: hidden; }
  .away .city { padding-right: 12px; }
  .home .city { padding-left: 12px; text-align: right; }
  .city.long { font-size: 26px; }
  .score { width: 76px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    font-size: 42px; font-weight: 800; letter-spacing: -1px; }
  .pre .score { display: none; }
  .pre .away .city { padding-right: 18px; }
  .pre .home .city { padding-left: 18px; }
  .lost .city, .lost .score { color: var(--dim); }
  .won .score { color: var(--gold); }

  /* Center */
  .center { width: 185px; height: 60px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(180deg, #161b25 0%, #07090d 100%); }
  .mode { display: none; }
  .is-live .m-live, .is-break .m-break, .is-label .m-label { display: flex; }
  .m-live { align-items: center; justify-content: space-between; width: 161px; height: 48px; }
  .inning { width: 44px; height: 40px; display: flex; align-items: center; justify-content: center; }
  .inning > * + * { margin-left: 4px; }
  #arrow { transition: transform .5s cubic-bezier(.4,0,.2,1); }
  .inning svg.down { transform: rotate(180deg); }
  .num { font-size: 26px; line-height: 26px; }
  .bases { flex-shrink: 0; }
  .bases rect { fill: transparent; stroke: var(--edge); stroke-width: 1.6; }
  .bases .base.on rect { fill: var(--gold); stroke: var(--gold); }
  .bases .base { transform-box: fill-box; transform-origin: center; }
  .bso { width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; }
  .bso > * + * { margin-top: 4px; }
  .outs { display: flex; }
  .outs i + i { margin-left: 5px; }
  .outs i { width: 8px; height: 8px; border-radius: 50%; background: var(--off); }
  .outs i.on { background: var(--gold); }
  .m-break { align-items: center; }
  .m-break > * + * { margin-left: 7px; }
  .m-break .lbl { margin-right: -3px; }      /* cancel trailing letter-spacing so the pair centres optically */
  .m-label .lbl { margin-right: -3px; }
  .m-label { flex-direction: column; align-items: center; }
  .m-label > * + * { margin-top: 3px; }
  .lbl { font-size: 12px; letter-spacing: 3px; line-height: 12px; color: var(--gold); }
  .lbl.muted { color: var(--muted); }
  .main { font-size: 26px; line-height: 26px; letter-spacing: 1px; white-space: nowrap; }
  .main.gold { color: var(--gold); letter-spacing: 2px; }

  /* Transitions between states: quiet, ~0.4 s, nothing flashes. */
  @keyframes enter { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: none; } }
  @keyframes rollIn { from { opacity: 0; transform: translateY(25%); } to { opacity: 1; transform: none; } }
  @keyframes tick { from { opacity: .55; transform: scale(.94); } to { opacity: 1; transform: none; } }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .enter { animation: enter .4s cubic-bezier(.2,.7,.2,1) both; }
  .roll { display: inline-block; animation: rollIn .4s cubic-bezier(.2,.7,.2,1) both; }
  #balls, #strikes { display: inline-block; }
  .tick { animation: tick .22s ease-out both; }
  .fade { animation: fadeIn .5s ease both; }
  .bases rect { transition: fill .35s ease, stroke .35s ease; }   /* runners: colour fade only, no movement */
  .outs i { transition: background-color .3s ease; }
  /* In-play changes */
  @keyframes outOn   { 0% { transform: scale(.7); opacity: .4; } 100% { transform: scale(1); opacity: 1; } }
  @keyframes clear   { 0% { opacity: 1; } 100% { opacity: .2; } }
  .outs i.pop { animation: outOn .35s cubic-bezier(.2,.7,.2,1) both; }
  .lost .city, .lost .score, .won .score, .city, .score { transition: color .6s ease; }
  .team, .score { transition: background .6s ease; }

  /* Feed has failed several times in a row: tiny red dot for the operator; the last good frame stays up. */
  #board.stale::after { content: ''; position: absolute; left: 3px; top: 3px; width: 4px; height: 4px; border-radius: 50%; background: #c0392b; }
</style>
</head>
<body>
<div id="board" class="pre is-label">
  <div class="team away" id="away">
    <div class="logo" id="awayLogo"></div>
    <div class="city" id="awayCity"></div>
    <div class="score" id="awayScore"></div>
  </div>

  <div class="center">
    <div class="mode m-live">
      <div class="inning">
        <svg id="arrow" width="11" height="9" viewBox="0 0 14 12" aria-hidden="true"><path d="M7 0 L14 12 L0 12 Z" fill="#FFC52F"/></svg>
        <div class="num" id="inning"></div>
      </div>
      <svg class="bases" width="54" height="40" viewBox="1 1 36 28" role="img" aria-label="Runners on base">
        <g class="base" id="b2"><rect x="14.5" y="4.5" width="9" height="9" transform="rotate(45 19 9)"/></g>
        <g class="base" id="b1"><rect x="24.5" y="14.5" width="9" height="9" transform="rotate(45 29 19)"/></g>
        <g class="base" id="b3"><rect x="4.5" y="14.5" width="9" height="9" transform="rotate(45 9 19)"/></g>
      </svg>
      <div class="bso">
        <div class="num" id="count"><span id="balls">0</span>-<span id="strikes">0</span></div>
        <div class="outs" role="img" aria-label="Outs"><i id="o1"></i><i id="o2"></i><i id="o3"></i></div>
      </div>
    </div>
    <div class="mode m-break"><div class="lbl" id="breakWord"></div><div class="num" id="breakInning"></div></div>
    <div class="mode m-label"><div class="lbl" id="label"></div><div class="main" id="main"></div></div>
  </div>

  <div class="team home" id="home">
    <div class="logo" id="homeLogo"></div>
    <div class="city" id="homeCity"></div>
    <div class="score" id="homeScore"></div>
  </div>
</div>

<script src="board.js?v=1c4e1ae09a27"></script>
</body>
</html>
