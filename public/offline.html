<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#A00000" />
    <title>Connection required | Wisconsin Creative</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f1117;
        color: #f5f5f5;
      }

      body {
        box-sizing: border-box;
        display: grid;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
      }

      main {
        width: min(100%, 28rem);
        text-align: center;
      }

      .brand {
        color: #d9d9de;
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 1rem 0 0.75rem;
        font-size: clamp(1.8rem, 8vw, 2.5rem);
        line-height: 1.05;
      }

      p {
        color: #b8bac4;
        line-height: 1.5;
      }

      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 1rem;
        padding: 0 1rem;
        border-radius: 0.5rem;
        background: #a00000;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }

      a:focus-visible {
        outline: 3px solid #fff;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="brand">Wisconsin Creative</div>
      <h1>Connection required</h1>
      <p>Connect to the internet to load your current gear, reservations, and schedule.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
