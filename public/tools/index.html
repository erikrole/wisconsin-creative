<!doctype html>
<!-- Tools hub. Lists the static tools that ship in this repo. No script. -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src 'self'; img-src data:; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <title>Tools</title>
  <meta name="description" content="Static tools for Wisconsin Creative: board sizes and QR codes.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3.5' fill='%23c5050c'/%3E%3Cpath fill='%23fff' d='M3 3h4v4H3zM9 3h4v4H9zM3 9h4v4H3zM9 9h4v4H9z'/%3E%3C/svg%3E">
  <style>
    @font-face { font-family: "Gotham"; src: url("/Gotham-Bold.woff2") format("woff2"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "Gotham"; src: url("/Gotham-Book.woff2") format("woff2"); font-weight: 400; font-display: swap; }
    :root {
      --bg: #ffffff; --ink: #1f1e1b; --ink-2: #5a5955; --ink-3: #5c5b56; --line: #ebebe8; --line-2: #dcdcd8;
      --font: "Gotham", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #191919; --ink: #ececea; --ink-2: #c4c3be; --ink-3: #a9a8a4; --line: #2c2c2c; --line-2: #3a3a3a; color-scheme: dark; }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 300px; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--font); }
    :focus-visible { outline: 2px solid #c5050c; outline-offset: 3px; }
    main { width: min(640px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 64px; }
    h1 { margin: 0 0 8px; font-size: 32px; letter-spacing: -0.02em; }
    p { margin: 0 0 24px; color: var(--ink-2); }
    ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
    a { display: flex; align-items: center; min-height: 64px; padding: 12px 14px; border: 1px solid var(--line-2); border-radius: 10px; color: inherit; text-decoration: none; }
    a:hover { background: rgba(55, 53, 47, 0.06); }
    a strong { display: block; font-size: 16px; }
    a span { display: block; color: var(--ink-3); font-size: 14px; font-weight: 400; }
  </style>
</head>
<body>
  <main>
    <h1>Tools</h1>
    <p>Small tools that run in the browser and do not need a sign-in.</p>
    <ul>
      <li><a href="/board-sizes"><strong>Board Sizes</strong><span>Pixel sizes, aspect ratios, and recorded safe areas for every venue board.</span></a></li>
      <li><a href="/qrcode"><strong>QR Studio</strong><span>QR codes for links, Wi-Fi, and contacts.</span></a></li>
    </ul>
  </main>
</body>
</html>
