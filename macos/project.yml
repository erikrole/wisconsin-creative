name: GearOps

options:
  bundleIdPrefix: com.erikrole
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  xcodeVersion: "26.6"

settings:
  base:
    SWIFT_VERSION: "6.0"
    ENABLE_PREVIEWS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    DEAD_CODE_STRIPPING: "YES"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
  configs:
    Debug:
      APS_ENVIRONMENT: development
    Release:
      APS_ENVIRONMENT: production

targets:
  GearOps:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: GearOps
      - path: ../ios/Wisconsin/Assets.xcassets
    resources:
      - path: GearOps/Supporting/AppIcon.icns
    info:
      path: GearOps/Supporting/Info.plist
      properties:
        CFBundleDisplayName: "Wisconsin Creative"
        CFBundleIconFile: "AppIcon"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: "public.app-category.utilities"
        LSUIElement: true
        NSHumanReadableCopyright: "Copyright © 2026 Erik Role"
    entitlements:
      path: GearOps/Supporting/GearOps.entitlements
      properties:
        com.apple.developer.aps-environment: $(APS_ENVIRONMENT)
    settings:
      base:
        PRODUCT_NAME: Wisconsin Creative
        PRODUCT_MODULE_NAME: GearOps
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.GearOps
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0.4"
        CURRENT_PROJECT_VERSION: "5"
        SWIFT_STRICT_CONCURRENCY: complete
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: T26T3G8C7Q
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: "YES"

  GearOpsTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "15.0"
    sources:
      - path: GearOpsTests
    dependencies:
      - target: GearOps
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.erikrole.GearOpsTests
        SWIFT_STRICT_CONCURRENCY: complete
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Wisconsin Creative.app/Contents/MacOS/Wisconsin Creative"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  GearOps:
    build:
      targets:
        GearOps: all
    test:
      targets:
        - name: GearOpsTests
          randomExecutionOrder: true
      gatherCoverageData: true
